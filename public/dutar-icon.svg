  <rect x="80" y="11" width="20" height="73" rx="7" fill="#faf7f2"/>
  <!-- Tuning pegs -->
  <circle cx="65" cy="9" r="9" fill="#faf7f2"/>
  <circle cx="115" cy="9" r="9" fill="#faf7f2"/>
  <!-- Strings -->
  <line x1="86" y1="16" x2="86" y2="174" stroke="#b85c2e" stroke-width="3" opacity="0.7"/>
  <line x1="94" y1="16" x2="94" y2="174" stroke="#b85c2e" stroke-width="3" opacity="0.7"/>
  <!-- Soundhole -->
